<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轻量全能扫描王 - 网页版Demo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide 图标 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- jsPDF 用于导出 PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- OpenCV.js 用于图像处理和轮廓检测 -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady()"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .tab-content { display: none; }
        .tab-content.active { display: flex; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- 顶部导航栏 -->
    <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 sticky top-0 z-50 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-indigo-500/30">
                <i data-lucide="scan" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-tight text-white">闪电扫描王</h1>
                <p id="opencv-status" class="text-xs text-amber-400">正在加载 OpenCV 引擎...</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="switchTab('home')" class="p-2 text-slate-400 hover:text-white transition" title="首页">
                <i data-lucide="home" class="w-5 h-5"></i>
            </button>
            <button onclick="switchTab('docs')" class="p-2 text-slate-400 hover:text-white transition relative" title="文档库">
                <i data-lucide="folder-open" class="w-5 h-5"></i>
                <span id="doc-badge" class="absolute top-1 right-1 bg-indigo-600 text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold text-white hidden">0</span>
            </button>
        </div>
    </header>

    <!-- 主体容器 -->
    <main class="flex-1 flex flex-col relative overflow-hidden max-w-md mx-auto w-full">

        <!-- 视图 1：首页/相机/上传 -->
        <div id="tab-home" class="tab-content active flex-col flex-1 p-4 justify-center items-center text-center space-y-6">
            <div class="w-32 h-32 rounded-3xl bg-indigo-600/10 border-2 border-dashed border-indigo-500/40 flex items-center justify-center mx-auto text-indigo-400 shadow-inner">
                <i data-lucide="camera" class="w-16 h-16 animate-pulse"></i>
            </div>
            <div class="space-y-2">
                <h2 class="text-2xl font-bold tracking-tight text-white">随时随地，智能扫描</h2>
                <p class="text-sm text-slate-400 max-w-xs mx-auto">自动识别边框、透视矫正、黑白增强，一键生成高清扫描件与 PDF。</p>
            </div>

            <div class="w-full space-y-3 pt-4">
                <!-- 拍照触发 -->
                <button onclick="openCamera()" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold py-4 px-6 rounded-2xl shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-3 transition transform active:scale-95">
                    <i data-lucide="camera" class="w-5 h-5"></i>
                    <span>手机拍照扫描</span>
                </button>
                <!-- 本地上传触发 -->
                <label class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-4 px-6 rounded-2xl border border-slate-700 flex items-center justify-center space-x-3 cursor-pointer transition transform active:scale-95">
                    <i data-lucide="image" class="w-5 h-5 text-indigo-400"></i>
                    <span>从相册选择图片</span>
                    <input type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                </label>
            </div>
        </div>

        <!-- 隐藏的拍照视频全屏流 -->
        <div id="camera-modal" class="absolute inset-0 bg-black z-50 flex flex-col justify-between hidden">
            <div class="p-4 flex justify-between items-center bg-black/40">
                <button onclick="closeCamera()" class="text-white p-2 rounded-full bg-slate-800/80">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
                <span class="text-sm font-medium text-white">请对准纸张或文档</span>
                <div class="w-10"></div>
            </div>
            <div class="flex-1 relative flex items-center justify-center overflow-hidden">
                <video id="video-stream" autoplay playsinline class="w-full h-full object-cover"></video>
                <!-- 取景框辅助网格 -->
                <div class="absolute inset-8 border-2 border-indigo-500/60 rounded-xl pointer-events-none flex flex-col justify-between p-2">
                    <div class="flex justify-between"><div class="w-4 h-4 border-t-2 border-l-2 border-white"></div><div class="w-4 h-4 border-t-2 border-r-2 border-white"></div></div>
                    <div class="flex justify-between"><div class="w-4 h-4 border-b-2 border-l-2 border-white"></div><div class="w-4 h-4 border-b-2 border-r-2 border-white"></div></div>
                </div>
            </div>
            <div class="p-6 bg-black/60 flex justify-center items-center">
                <button onclick="takeSnapshot()" class="w-20 h-20 bg-white rounded-full border-4 border-indigo-600 flex items-center justify-center shadow-2xl active:scale-95 transition">
                    <div class="w-16 h-16 bg-indigo-600 rounded-full"></div>
                </button>
            </div>
        </div>

        <!-- 视图 2：裁剪与边框调整 (Canvas + 互动拖拽点) -->
        <div id="tab-crop" class="tab-content flex-col flex-1 justify-between p-4 bg-slate-950">
            <div class="flex justify-between items-center">
                <button onclick="switchTab('home')" class="text-sm text-slate-400 hover:text-white flex items-center space-x-1">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i><span>重选</span>
                </button>
                <h3 class="font-bold text-white text-sm">调整边框定位</h3>
                <button onclick="autoDetectCorners()" class="text-xs bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 px-3 py-1 rounded-full font-medium">智能识别</button>
            </div>

            <!-- 画布展示区 -->
            <div class="flex-1 relative my-3 flex items-center justify-center overflow-hidden bg-slate-900 rounded-2xl border border-slate-800">
                <canvas id="crop-canvas" class="max-w-full max-h-full object-contain cursor-crosshair touch-none"></canvas>
            </div>

            <div class="space-y-3">
                <p class="text-xs text-slate-400 text-center">拖拽四个角的白点以精确对齐文档边缘</p>
                <button onclick="applyWarpPerspective()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2 transition">
                    <span>下一步：滤镜与增强</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <!-- 视图 3：滤镜增强与调校 -->
        <div id="tab-filter" class="tab-content flex-col flex-1 justify-between p-4 bg-slate-950">
            <div class="flex justify-between items-center">
                <button onclick="switchTab('crop')" class="text-sm text-slate-400 hover:text-white flex items-center space-x-1">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i><span>上一步</span>
                </button>
                <h3 class="font-bold text-white text-sm">图像增强与处理</h3>
                <div class="w-10"></div>
            </div>

            <!-- 处理后预览图 -->
            <div class="flex-1 relative my-3 flex items-center justify-center overflow-hidden bg-slate-900 rounded-2xl border border-slate-800">
                <canvas id="filter-canvas" class="max-w-full max-h-full object-contain"></canvas>
            </div>

            <!-- 滤镜选项切换栏 -->
            <div class="space-y-3">
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="setFilter('magic')" id="btn-filter-magic" class="flex flex-col items-center p-2 rounded-xl bg-indigo-600 text-white text-xs space-y-1 transition border border-indigo-500">
                        <i data-lucide="sparkles" class="w-4 h-4"></i><span>增亮黑白</span>
                    </button>
                    <button onclick="setFilter('bw')" id="btn-filter-bw" class="flex flex-col items-center p-2 rounded-xl bg-slate-800 text-slate-300 text-xs space-y-1 transition border border-slate-700">
                        <i data-lucide="file-text" class="w-4 h-4"></i><span>纯黑白</span>
                    </button>
                    <button onclick="setFilter('gray')" id="btn-filter-gray" class="flex flex-col items-center p-2 rounded-xl bg-slate-800 text-slate-300 text-xs space-y-1 transition border border-slate-700">
                        <i data-lucide="moon" class="w-4 h-4"></i><span>灰度</span>
                    </button>
                    <button onclick="setFilter('original')" id="btn-filter-original" class="flex flex-col items-center p-2 rounded-xl bg-slate-800 text-slate-300 text-xs space-y-1 transition border border-slate-700">
                        <i data-lucide="image" class="w-4 h-4"></i><span>原图</span>
                    </button>
                </div>

                <button onclick="saveCurrentScan()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-emerald-600/30 flex items-center justify-center space-x-2 transition">
                    <i data-lucide="check" class="w-5 h-5"></i>
                    <span>保存并加入文档</span>
                </button>
            </div>
        </div>

        <!-- 视图 4：文档库与导出 -->
        <div id="tab-docs" class="tab-content flex-col flex-1 justify-between p-4 bg-slate-900">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-white text-base">扫描文档列表 (<span id="doc-count">0</span>)</h3>
                <button onclick="clearAllDocs()" class="text-xs text-rose-400 hover:text-rose-300">清空全部</button>
            </div>

            <!-- 文档列表缩略图区域 -->
            <div id="doc-list-container" class="flex-1 my-3 overflow-y-auto space-y-3 pr-1">
                <!-- 动态填充 -->
                <div id="empty-docs" class="h-full flex flex-col items-center justify-center text-slate-500 space-y-2">
                    <i data-lucide="folder-open" class="w-12 h-12 stroke-1"></i>
                    <p class="text-sm">暂无扫描件，请先拍照或上传</p>
                </div>
            </div>

            <!-- 批量导出按钮 -->
            <div class="space-y-2 pt-2 border-t border-slate-800">
                <button onclick="exportAsPDF()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2 transition">
                    <i data-lucide="file-down" class="w-5 h-5"></i>
                    <span>导出为多页 PDF 文档</span>
                </button>
                <button onclick="switchTab('home')" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium py-2.5 rounded-xl transition">
                    + 继续添加扫描件
                </button>
            </div>
        </div>

    </main>

    <!-- 底部状态栏或版权 -->
    <footer class="text-center py-2 text-[10px] text-slate-500 border-t border-slate-900 bg-slate-950">
        纯前端浏览器运行 · 零服务器存储隐私安全
    </footer>

    <!-- 全局轻量提示框 -->
    <div id="toast" class="fixed bottom-16 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded-full text-xs shadow-2xl border border-slate-700 transition-all duration-300 opacity-0 pointer-events-none z-50">
        提示信息
    </div>

    <!-- 核心逻辑脚本 -->
    <script>
        // 初始化 Lucide 图标
        lucide.createIcons();

        let isOpenCvReady = false;
        let activeTab = 'home';
        let scannedDocs = []; // 存储所有扫描完的图片数据 (Base64)
        
        // 核心图像工作流变量
        let sourceImage = new Image();
        let corners = []; // 四个角顶点 [{x, y}, ...]
        let draggingPointIndex = null;
        let currentFilterType = 'magic';
        let processedCanvasDataUrl = '';

        function onOpenCvReady() {
            isOpenCvReady = true;
            document.getElementById('opencv-status').innerText = 'OpenCV 引擎就绪';
            document.getElementById('opencv-status').classList.remove('text-amber-400');
            document.getElementById('opencv-status').classList.add('text-emerald-400');
        }

        // 切换视图 Tab
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            activeTab = tabId;
            lucide.createIcons();
            if(tabId === 'docs') {
                renderDocList();
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // 1. 拍照相关
        let mediaStream = null;
        async function openCamera() {
            const modal = document.getElementById('camera-modal');
            modal.classList.remove('hidden');
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, 
                    audio: false 
                });
                document.getElementById('video-stream').srcObject = mediaStream;
            } catch (err) {
                modal.classList.add('hidden');
                showToast('无法访问相机权限，请尝试从相册上传');
                console.error(err);
            }
        }

        function closeCamera() {
            const modal = document.getElementById('camera-modal');
            modal.classList.add('hidden');
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
        }

        function takeSnapshot() {
            const video = document.getElementById('video-stream');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            closeCamera();
            loadSourceImage(canvas.toDataURL('image/jpeg', 0.9));
        }

        // 本地相册上传
        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                loadSourceImage(event.target.result);
            }
            reader.readAsDataURL(file);
            e.target.value = ''; // 清空选择
        }

        // 加载图片并进入裁剪视图
        function loadSourceImage(dataUrl) {
            sourceImage.onload = function() {
                initCorners();
                switchTab('crop');
                initCropCanvas();
            }
            sourceImage.src = dataUrl;
        }

        // 2. 边框智能检测与透视裁剪
        function initCorners() {
            const w = sourceImage.width;
            const h = sourceImage.height;
            // 默认取图片内部 10% 边距作为初始四个角
            corners = [
                { x: w * 0.15, y: h * 0.15 }, // 左上
                { x: w * 0.85, y: h * 0.15 }, // 右上
                { x: w * 0.85, y: h * 0.85 }, // 右下
                { x: w * 0.15, y: h * 0.85 }  // 左下
            ];
        }

        // 简易智能边缘检测（利用 OpenCV 查找最大四边形轮廓）
        function autoDetectCorners() {
            if (!isOpenCvReady) {
                showToast('OpenCV 正在加载中，请稍候');
                return;
            }
            try {
                let src = cv.imread(sourceImage);
                let gray = new cv.Mat();
                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
                cv.GaussianBlur(gray, gray, new cv.Size(5, 5), 0);
                
                let edged = new cv.Mat();
                cv.Canny(gray, edged, 75, 200);

                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();
                cv.findContours(edged, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

                let maxArea = 0;
                let bestApprox = null;

                for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i);
                    let area = cv.contourArea(cnt);
                    let approx = new cv.Mat();
                    let peri = cv.arcLength(cnt, true);
                    cv.approxPolyDP(cnt, approx, 0.02 * peri, true);

                    if (approx.rows === 4 && area > maxArea && cv.isContourConvex(approx)) {
                        maxArea = area;
                        bestApprox = approx;
                    } else {
                        approx.delete();
                    }
                    cnt.delete();
                }

                if (bestApprox && maxArea > (src.cols * src.rows * 0.05)) {
                    corners = [
                        { x: bestApprox.data32S[0], y: bestApprox.data32S[1] },
                        { x: bestApprox.data32S[2], y: bestApprox.data32S[3] },
                        { x: bestApprox.data32S[4], y: bestApprox.data32S[5] },
                        { x: bestApprox.data32S[6], y: bestApprox.data32S[7] }
                    ];
                    showToast('智能识别边框成功！');
                    bestApprox.delete();
                } else {
                    showToast('未检测到规整文档边框，已采用默认区域');
                    initCorners();
                }

                src.delete(); gray.delete(); edged.delete(); contours.delete(); hierarchy.delete();
                drawCropCanvas();
            } catch (err) {
                console.error(err);
                showToast('自动识别出错，请手动调整四个角');
            }
        }

        let cropCanvas, cropCtx, scaleRatio = 1;

        function initCropCanvas() {
            cropCanvas = document.getElementById('crop-canvas');
            cropCtx = cropCanvas.getContext('2d');
            
            // 设定 Canvas 显示尺寸适应容器
            const container = cropCanvas.parentElement;
            const maxW = container.clientWidth;
            const maxH = container.clientHeight;
            
            let imgW = sourceImage.width;
            let imgH = sourceImage.height;
            
            scaleRatio = Math.min(maxW / imgW, maxH / imgH);
            cropCanvas.width = imgW * scaleRatio;
            cropCanvas.height = imgH * scaleRatio;

            drawCropCanvas();
            setupCropInteractions();
        }

        function drawCropCanvas() {
            cropCtx.clearRect(0, 0, cropCanvas.width, cropCanvas.height);
            cropCtx.drawImage(sourceImage, 0, 0, cropCanvas.width, cropCanvas.height);

            // 绘制四个角连接线
            cropCtx.beginPath();
            cropCtx.moveTo(corners[0].x * scaleRatio, corners[0].y * scaleRatio);
            for(let i=1; i<4; i++) {
                cropCtx.lineTo(corners[i].x * scaleRatio, corners[i].y * scaleRatio);
            }
            cropCtx.closePath();
            cropCtx.strokeStyle = '#6366f1';
            cropCtx.lineWidth = 3;
            cropCtx.fillStyle = 'rgba(99, 102, 241, 0.15)';
            cropCtx.fill();
            cropCtx.stroke();

            // 绘制可拖拽顶点
            corners.forEach((pt, index) => {
                cropCtx.beginPath();
                cropCtx.arc(pt.x * scaleRatio, pt.y * scaleRatio, 14, 0, Math.PI * 2);
                cropCtx.fillStyle = '#ffffff';
                cropCtx.shadowColor = 'rgba(0,0,0,0.5)';
                cropCtx.shadowBlur = 6;
                cropCtx.fill();
                cropCtx.lineWidth = 3;
                cropCtx.strokeStyle = '#6366f1';
                cropCtx.stroke();
                cropCtx.shadowBlur = 0; // 重置阴影
            });
        }

        function setupCropInteractions() {
            const getPos = (e) => {
                const rect = cropCanvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) / scaleRatio,
                    y: (clientY - rect.top) / scaleRatio
                };
            };

            const startDrag = (e) => {
                const pos = getPos(e);
                // 查找距离哪个控制点最近
                for (let i = 0; i < 4; i++) {
                    const dist = Math.hypot(pos.x - corners[i].x, pos.y - corners[i].y);
                    if (dist < 45 / scaleRatio) { // 响应点击范围
                        draggingPointIndex = i;
                        break;
                    }
                }
            };

            const onDrag = (e) => {
                if (draggingPointIndex === null) return;
                e.preventDefault();
                const pos = getPos(e);
                corners[draggingPointIndex].x = Math.max(0, Math.min(sourceImage.width, pos.x));
                corners[draggingPointIndex].y = Math.max(0, Math.min(sourceImage.height, pos.y));
                drawCropCanvas();
            };

            const endDrag = () => {
                draggingPointIndex = null;
            };

            cropCanvas.onmousedown = startDrag;
            window.onmousemove = onDrag;
            window.onmouseup = endDrag;

            cropCanvas.ontouchstart = startDrag;
            window.ontouchmove = onDrag;
            window.ontouchend = endDrag;
        }

        // 透视变换与矫正 (Perspective Warp)
        function applyWarpPerspective() {
            if (!isOpenCvReady) {
                // 如果 OpenCV 没准备好，退化采用普通裁剪
                processFilterDirectly(sourceImage);
                switchTab('filter');
                return;
            }

            try {
                let src = cv.imread(sourceImage);
                
                // 计算目标宽度与高度（基于四边形各边最大长度）
                let widthA = Math.hypot(corners[1].x - corners[0].x, corners[1].y - corners[0].y);
                let widthB = Math.hypot(corners[2].x - corners[3].x, corners[2].y - corners[3].y);
                let maxWidth = Math.max(widthA, widthB);

                let heightA = Math.hypot(corners[3].x - corners[0].x, corners[3].y - corners[0].y);
                let heightB = Math.hypot(corners[2].x - corners[1].x, corners[2].y - corners[1].y);
                let maxHeight = Math.max(heightA, heightB);

                maxWidth = Math.max(maxWidth, 400);
                maxHeight = Math.max(maxH = maxHeight, 400);

                let srcTri = cv.matFrommArray ? null : cv.matFromArray(4, 1, cv.CV_32FC2, [
                    corners[0].x, corners[0].y,
                    corners[1].x, corners[1].y,
                    corners[2].x, corners[2].y,
                    corners[3].x, corners[3].y
                ]);

                let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                    0, 0,
                    maxWidth, 0,
                    maxWidth, maxHeight,
                    0, maxHeight
                ]);

                let M = cv.getPerspectiveTransform(srcTri, dstTri);
                let warpedImage = new cv.Mat();
                let dsize = new cv.Size(maxWidth, maxHeight);
                cv.warpPerspective(src, warpedImage, M, dsize, cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());

                // 将矫正后的 Mat 转为 Canvas
                const outputCanvas = document.createElement('canvas');
                cv.imshow(outputCanvas, warpedImage);
                
                let warpedImgObj = new Image();
                warpedImgObj.onload = function() {
                    processFilterDirectly(warpedImgObj);
                    switchTab('filter');
                }
                warpedImgObj.src = outputCanvas.toDataURL('image/jpeg', 0.95);

                src.delete(); srcTri.delete(); dstTri.delete(); M.delete(); warpedImage.delete();
            } catch (err) {
                console.error(err);
                showToast('透视变换失败，采用原图继续');
                processFilterDirectly(sourceImage);
                switchTab('filter');
            }
        }

        // 3. 图像增强与滤镜处理
        let currentProcessedImageObj = null;

        function processFilterDirectly(imgObj) {
            currentProcessedImageObj = imgObj;
            applySelectedFilter();
        }

        function setFilter(type) {
            currentFilterType = type;
            ['magic', 'bw', 'gray', 'original'].forEach(t => {
                const btn = document.getElementById('btn-filter-' + t);
                if(t === type) {
                    btn.className = "flex flex-col items-center p-2 rounded-xl bg-indigo-600 text-white text-xs space-y-1 transition border border-indigo-500";
                } else {
                    btn.className = "flex flex-col items-center p-2 rounded-xl bg-slate-800 text-slate-300 text-xs space-y-1 transition border border-slate-700";
                }
            });
            applySelectedFilter();
        }

        function applySelectedFilter() {
            if (!currentProcessedImageObj) return;
            const canvas = document.getElementById('filter-canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = currentProcessedImageObj.width;
            canvas.height = currentProcessedImageObj.height;
            ctx.drawImage(currentProcessedImageObj, 0, 0);

            if (currentFilterType === 'original') {
                processedCanvasDataUrl = canvas.toDataURL('image/jpeg', 0.9);
                return;
            }

            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = imgData.data;

            if (currentFilterType === 'gray') {
                for (let i = 0; i < data.length; i += 4) {
                    let avg = 0.3 * data[i] + 0.59 * data[i+1] + 0.11 * data[i+2];
                    data[i] = avg; data[i+1] = avg; data[i+2] = avg;
                }
            } else if (currentFilterType === 'bw') {
                // 纯黑白阈值化
                for (let i = 0; i < data.length; i += 4) {
                    let avg = 0.3 * data[i] + 0.59 * data[i+1] + 0.11 * data[i+2];
                    let v = avg > 145 ? 255 : 0;
                    data[i] = v; data[i+1] = v; data[i+2] = v;
                }
            } else if (currentFilterType === 'magic') {
                // 增亮扫描模式：提高对比度 + 降噪提白
                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i], g = data[i+1], b = data[i+2];
                    // 简易高对比度白底黑字算法
                    let gray = 0.3 * r + 0.59 * g + 0.11 * b;
                    let enhanced = gray < 180 ? gray * 0.75 : 255; // 压暗文字，提亮背景
                    data[i] = enhanced; data[i+1] = enhanced; data[i+2] = enhanced;
                }
            }

            ctx.putImageData(imgData, 0, 0);
            processedCanvasDataUrl = canvas.toDataURL('image/jpeg', 0.92);
        }

        // 4. 文档管理与导出
        function saveCurrentScan() {
            if (!processedCanvasDataUrl) return;
            scannedDocs.push(processedCanvasDataUrl);
            updateDocBadge();
            showToast('已成功加入扫描文档库！');
            switchTab('docs');
        }

        function updateDocBadge() {
            const badge = document.getElementById('doc-badge');
            const countLabel = document.getElementById('doc-count');
            countLabel.innerText = scannedDocs.length;
            if (scannedDocs.length > 0) {
                badge.innerText = scannedDocs.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function renderDocList() {
            const container = document.getElementById('doc-list-container');
            const emptyEl = document.getElementById('empty-docs');
            
            if (scannedDocs.length === 0) {
                emptyEl.classList.remove('hidden');
                container.innerHTML = '';
                container.appendChild(emptyEl);
                return;
            }

            container.innerHTML = '';
            scannedDocs.forEach((docUrl, idx) => {
                const item = document.createElement('div');
                item.className = "flex items-center justify-between bg-slate-800/80 border border-slate-700/60 p-3 rounded-2xl shadow-sm";
                item.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <img src="${docUrl}" class="w-12 h-16 object-cover rounded-lg border border-slate-700">
                        <div>
                            <h4 class="text-xs font-semibold text-white">扫描件 0${idx + 1}</h4>
                            <p class="text-[10px] text-slate-400">高清彩色/黑白文档</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-1">
                        <a href="${docUrl}" download="Scan_${idx+1}.jpg" class="p-2 text-slate-400 hover:text-white transition" title="下载单张JPG">
                            <i data-lucide="download" class="w-4 h-4"></i>
                        </a>
                        <button onclick="deleteDoc(${idx})" class="p-2 text-rose-400 hover:text-rose-300 transition" title="删除">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
                container.appendChild(item);
            });
            lucide.createIcons();
        }

        function deleteDoc(index) {
            scannedDocs.splice(index, 1);
            updateDocBadge();
            renderDocList();
            showToast('已删除该扫描件');
        }

        function clearAllDocs() {
            if (confirm('确定清空所有扫描文档吗？')) {
                scannedDocs = [];
                updateDocBadge();
                renderDocList();
                showToast('已清空');
            }
        }

        // 导出 PDF (利用 jsPDF)
        async function exportAsPDF() {
            if (scannedDocs.length === 0) {
                showToast('当前没有可导出的扫描文档');
                return;
            }

            showToast('正在生成 PDF 文件...');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({
                orientation: 'portrait',
                unit: 'mm',
                format: 'a4'
            });

            const pageWidth = pdf.internal.pageSize.getWidth();
            const pageHeight = pdf.internal.pageSize.getHeight();

            for (let i = 0; i < scannedDocs.length; i++) {
                if (i > 0) pdf.addPage();
                
                // 获取图片宽高比
                await new Promise((resolve) => {
                    const img = new Image();
                    img.src = scannedDocs[i];
                    img.onload = function() {
                        let imgWidth = pageWidth;
                        let imgHeight = (img.height * pageWidth) / img.width;
                        if (imgHeight > pageHeight) {
                            imgHeight = pageHeight;
                            imgWidth = (img.width * pageHeight) / img.height;
                        }
                        const x = (pageWidth - imgWidth) / 2;
                        const y = (pageHeight - imgHeight) / 2;
                        pdf.addImage(scannedDocs[i], 'JPEG', x, y, imgWidth, imgHeight);
                        resolve();
                    }
                });
            }

            pdf.save(`扫描全能王_导出_${new Date().toISOString().slice(0,10)}.pdf`);
            showToast('PDF 导出成功！');
        }
    </script>
</body>
